<svg xmlns="http://www.w3.org/2000/svg" width="270" height="200" viewBox="0 0 270 200" role="img" aria-label="Ciencias y Sistemas">
<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#101935"/><stop offset="1" stop-color="#080c18"/>
  </linearGradient>
  <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
    <path d="M18 0H0V18" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
  </pattern>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#34d399"/>
    <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip"><rect x="1" y="1" width="268" height="198" rx="14"/></clipPath>
</defs>
<rect x="1" y="1" width="268" height="198" rx="14" fill="url(#bg)"/>
<rect x="1" y="1" width="268" height="198" rx="14" fill="url(#grid)"/>
<rect x="1" y="1" width="268" height="198" rx="14" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
<g clip-path="url(#clip)">
  <rect x="-90" y="1" width="90" height="2.5" fill="url(#scan)">
    <animate attributeName="x" from="-90" to="270" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</g>
<path d="M244 188 H258 V174" fill="none" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="248" cy="28" r="3.5" fill="#34d399">
  <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="20" y="32" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11.5" letter-spacing="1.4" fill="#34d399">FORMACIÓN · USAC</text>
<text x="20" y="66" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f1f5f9">Ciencias y Sistemas</text>
<text x="20" y="96" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9fb0c8">Cierre de pensum. Software</text>
<text x="20" y="116" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9fb0c8">Avanzado, Bases de Datos 1 y</text>
<text x="20" y="136" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9fb0c8">2, Redes 1 y 2, Análisis y</text>
<text x="20" y="156" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9fb0c8">Diseño.</text>

</svg>
